# Security headers for the web app. Included by nginx.conf in every location
# (nginx drops inherited add_header lines when a location adds its own), and read
# by the production-build e2e server (e2e/support/prod-server.mjs) so the CSP is
# tested against the real build. HSTS belongs on the TLS-terminating proxy.
#
# CSP notes: no inline scripts (critical-CSS inlining is off in angular.json);
# 'unsafe-inline' for styles is needed for Angular component styles; images are
# same-origin (signed /api/v1/media URLs), data: (QR codes) and blob: (upload previews).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
