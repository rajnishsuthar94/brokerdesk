# Serves the Angular SPA and proxies /api to the NestJS API on the same origin,
# so auth cookies stay first-party (SameSite=Strict) and no CORS is needed.
# In production, terminate TLS in front of this (with HSTS) and set TRUST_PROXY_HOPS on the API.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  # Photo uploads: up to 10 files of 8 MB are re-encoded by the API; keep in step with its limits.
  client_max_body_size 90m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Service worker files and the manifest must never be cached long, or updates would stall.
  location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Hashed build assets can be cached for a year.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # SPA fallback. index.html is never cached so new releases load immediately.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
